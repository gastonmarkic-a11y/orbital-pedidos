<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>beRabbit</title>
<meta name="theme-color" content="#f3eada">
<link rel="icon" href="/br/conejo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* beRabbit · marca independiente. Tokens tomados de la presentación "Programa Ópticas 2026". */
:root{
  --bg:#f3eada; --paper:#fbf7f0; --card:#ffffff; --ink:#201b17; --ink2:#6f655c; --ink3:#9a8f84; --line:#e6dccb; --line2:#d9ccb6;
  --rabbit:#b87545; --rust:#a8441e; --rust-soft:#f6e3d8; --esp:#1f1b18; --esp2:#2b2622; --ok:#3d7a4f; --ok-soft:#e3efe5; --warn:#c0501f;
  --serif:"DM Serif Display",Georgia,serif; --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --sh:0 1px 2px rgba(60,40,20,.06),0 4px 16px rgba(60,40,20,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171310; --paper:#1f1a16; --card:#26201b; --ink:#f3eada; --ink2:#bdb1a3; --ink3:#8c8174; --line:#352d26; --line2:#43392f;
  --rust:#e0794d; --rust-soft:#3a2418; --ok:#6fb782; --ok-soft:#1d2e22; --warn:#ec8a5c; --sh:none}}
:root[data-theme="dark"]{--bg:#171310;--paper:#1f1a16;--card:#26201b;--ink:#f3eada;--ink2:#bdb1a3;--ink3:#8c8174;--line:#352d26;--line2:#43392f;
  --rust:#e0794d;--rust-soft:#3a2418;--ok:#6fb782;--ok-soft:#1d2e22;--warn:#ec8a5c;--sh:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;overflow-x:hidden}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.01em;text-wrap:balance}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.eb{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--rust)}
.muted{color:var(--ink2)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* barra superior */
.top{position:relative;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none}
.brand img.c{height:26px} .brand img.w{height:17px}
.ctx{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--rust);white-space:nowrap}
.sp{flex:1}
/* franja de muestra y selector de paneles (solo en la muestra) */
.muestra{position:sticky;top:0;z-index:30;background:#a8441e;color:#fff;text-align:center;font-weight:700;font-size:14px;letter-spacing:.02em;padding:8px 16px;line-height:1.3}
.muestra b{display:inline-block;background:#fff;color:#a8441e;border-radius:6px;padding:1px 8px;margin-right:8px;letter-spacing:.12em;font-size:13px}
.quien{border-top:1px solid var(--line);background:var(--paper)}
.quien .wrap{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:thin}
.qb{display:flex;align-items:center;gap:10px;text-decoration:none;border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:8px 14px 8px 10px;white-space:nowrap;flex:none}
.qb .qi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--rust-soft);color:var(--rust);flex:none}
.qb .qi svg{width:17px;height:17px}
.qb small{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);line-height:1.2}
.qb span.n{font-weight:700;font-size:15px;line-height:1.2}
.qb[aria-current]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.qb[aria-current] small{color:var(--bg);opacity:.7}
.qb[aria-current] .qi{background:var(--rust);color:#fff}
.qb.min{padding:8px 12px}
.vista{background:var(--esp);color:#f3eada}
.vista .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px}
.vista .who2{font-family:var(--serif);font-size:22px;line-height:1.1}
.vista .who2 em{font-style:normal;color:#f0a77f}
.vista p{margin:0;font-size:14px;color:#cbbfb1;flex:1;min-width:240px}
@media(max-width:760px){.ctx{display:none}}

/* bloques */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.acc{background:var(--rust);color:#fff;border-color:var(--rust)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:none;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--paper);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--rust-soft);color:var(--warn);border-color:transparent}
.pill.inv{background:var(--ink);color:var(--bg);border-color:transparent}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.g2,.g3{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}

/* encabezado de panel (como la pantalla de ejemplo) */
.phead{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding:18px}
.phead .who b{font-size:15px} .phead .who .eb{margin-left:6px}
.phead h2{font-size:28px;margin:2px 0}
.kpis{display:flex;gap:26px;flex-wrap:wrap}
.kpi .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.kpi .v{font-size:24px;font-family:var(--sans);font-weight:500}
.kpi .v.acc{color:var(--rust)} .kpi .v.ok{color:var(--ok)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:thin}
.tab{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;font-size:14px;white-space:nowrap;text-decoration:none}
.tab[aria-current]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{opacity:.7;margin-left:4px}

/* tablas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:600;text-align:center;background:var(--paper);padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left}
td.z{color:var(--warn);font-weight:600}
td .cam{color:var(--ok);font-size:12px;font-weight:600;margin-left:3px}
td.tot{font-weight:700}
.tl td,.tl th{text-align:left}

/* selector de combinación */
.cfg{display:grid;grid-template-columns:1.15fr 1fr;gap:20px}
@media(max-width:860px){.cfg{grid-template-columns:1fr}}
.stage{background:linear-gradient(180deg,#fff,#f7f1e7);border-radius:var(--r);border:1px solid var(--line);aspect-ratio:16/9;display:grid;place-items:center;position:relative;overflow:hidden}
.stage img{width:84%;height:auto;filter:drop-shadow(0 10px 14px rgba(40,25,10,.18))}
.stage .tagc{position:absolute;left:14px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
.lbl{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:0 0 8px}
.models{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media(max-width:520px){.models{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mb{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 4px 4px;display:grid;gap:2px;justify-items:center;font-size:11px;color:var(--ink2)}
.mb img{width:100%;height:28px;object-fit:contain}
.mb[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);color:var(--ink);font-weight:600}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line2);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:6px 12px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.virt{border-style:dashed}
.note{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--paper);border:1px solid var(--line)}
.note.ok{background:var(--ok-soft);border-color:transparent}
.note.warn{background:var(--rust-soft);border-color:transparent}
.note b{font-weight:700}

/* formularios */
.fld{display:grid;gap:5px} .fld label{font-size:13px;font-weight:600;color:var(--ink2)}
.in{border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:9px 11px;width:100%}
.in:focus{outline:2px solid var(--rust);outline-offset:1px}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer}
.check input{margin-top:3px;accent-color:var(--rust)}

/* lista */
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:600} .li .s{font-size:13px;color:var(--ink2)}
.li .grow{flex:1;min-width:0}
.thumb{width:62px;height:30px;object-fit:contain;flex:none}

/* modal y toast */
.modal{position:fixed;inset:0;background:rgba(20,14,10,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal .box{background:var(--card);border-radius:18px;max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}

/* oscuro (bloques espresso de la presentación) */
.dark{background:var(--esp);color:#f3eada;--card:#2b2622;--line:#3b342e;--line2:#4a4139;--ink:#f3eada;--ink2:#c8bcae;--ink3:#9a8f84;--paper:#2b2622}
.rust-bg{background:#a8441e;color:#fbefe6}

/* presentación web */
.slide{padding:72px 0}
.slide h2{font-size:clamp(30px,4.4vw,52px);line-height:1.08}
.slide p.lead{font-size:18px;max-width:640px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;min-height:calc(100vh - 60px)}
.hero .l{padding:64px 6vw;display:flex;flex-direction:column;justify-content:center;gap:18px}
.hero h1{font-size:clamp(40px,6vw,76px);line-height:1.02}
.hero .r{background:url(/br/exhibidor.jpg) center/cover;min-height:420px}
@media(max-width:860px){.hero{grid-template-columns:1fr}.hero .l{padding:48px 16px}}
.big{font-family:var(--serif);font-size:48px;line-height:1}
.cmp td,.cmp th{text-align:left;white-space:normal}
.cmp td:last-child,.cmp th:last-child{background:var(--rust-soft);font-weight:600}
.steps{counter-reset:s;display:grid;gap:14px}
.quote{font-family:var(--serif);font-size:clamp(22px,2.6vw,30px);line-height:1.25}
input[type=range]{width:100%;accent-color:var(--rust)}

/* tienda */
.chan{display:grid;gap:10px;padding:18px;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
.chan h3{font-size:22px}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--rust-soft);color:var(--rust)}
.ico svg{width:20px;height:20px}

/* hub */
.door{display:grid;gap:8px;padding:22px;text-decoration:none;border-radius:18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);transition:transform .15s}
.door:hover{transform:translateY(-2px)}
.door h3{font-size:26px}
.arch td,.arch th{text-align:left;white-space:normal;vertical-align:top}

/* piezas de marketing */
.piece{aspect-ratio:9/16;border-radius:14px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:16px;color:#f3eada;background:var(--esp)}
.piece.sq{aspect-ratio:1/1}
.piece h4{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.05;margin:0}
.piece img.g{width:100%}
.piece .addr{font-size:12px;opacity:.85}
.qr svg{width:150px;height:150px;background:#fff;border-radius:8px;padding:6px}
.stepper{display:flex;gap:4px}
.stepper span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.stepper span.on{background:var(--ok)}
.qn{width:52px;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:5px 4px;text-align:center;font-variant-numeric:tabular-nums}
.qn:not(:placeholder-shown){border-color:var(--ink);font-weight:700}
/* stock y reposición */
.stk{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:960px){.stk{grid-template-columns:1fr}.stk #rpSum{position:static!important}}
.ia-av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--rust);color:#fff;font-weight:700;font-size:13px;flex:none}
.ia-d{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.ia-d li{display:flex;gap:9px;font-size:14px}.ia-d li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rust);margin-top:8px;flex:none}
.sug{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer}
.sug input{margin-top:4px;accent-color:var(--rust)}
.chat{display:grid;gap:8px;max-height:360px;overflow:auto}
.msg{padding:10px 12px;border-radius:12px;font-size:14px;max-width:94%}
.msg.yo{justify-self:end;background:var(--ink);color:var(--bg)}
.msg.ia{justify-self:start;background:var(--paper);border:1px solid var(--line)}
.gr{display:grid;grid-template-columns:128px minmax(0,1fr) minmax(0,1.15fr) 118px 54px;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.gr.h{padding:8px 14px;background:var(--paper);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:600;border-top:1px solid var(--line)}
.gm{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.gm .thumb{width:46px}
.gc,.ga{display:flex;gap:7px;flex-wrap:wrap}
.gf,.gl{display:flex;align-items:center;gap:6px}
.mlab{display:none}
.cd{position:relative;width:28px;height:28px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);font-size:11px;font-weight:700;color:#fff}
.cd.light{color:#201b17}
.cd.z{background:transparent!important;box-shadow:none;border:2px dashed var(--warn)}
.bc{position:absolute;bottom:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--card)}
.bp{position:absolute;top:-8px;right:-8px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--rust);color:#fff;font-size:10px;line-height:18px;font-weight:700}
.cc{position:relative;display:grid;justify-items:center;min-width:44px;padding:3px 6px;border:1px solid var(--line2);border-radius:9px;background:var(--card);font-variant-numeric:tabular-nums;line-height:1.2}
.cc .al{font-size:10px;color:var(--ink3);font-weight:600}
.cc b{font-size:15px}
.cc.z{border-color:var(--warn);border-style:dashed}.cc.z b{color:var(--warn)}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.leg .dot{width:10px;height:10px;vertical-align:-1px}
.qi{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 3px 3px 9px;border-radius:99px;background:var(--paper);border:1px solid var(--line)}
.qi .dot{width:9px;height:9px}
.qi button{border:0;background:none;padding:0 5px;color:var(--ink3);font-size:15px;line-height:1}
@media(max-width:760px){.gr{grid-template-columns:1fr 1fr}.gr.h{display:none}.gm,.gc,.ga{grid-column:1/-1}.mlab{display:inline}}
.foot{padding:28px 0 40px;color:var(--ink3);font-size:13px}
.empty{padding:28px;text-align:center;color:var(--ink2)}
</style>
</head>
<body>
<div class="muestra" role="note"><b>MUESTRA</b>Prototipo para mostrar cómo funciona beRabbit. Todos los datos son de ejemplo.</div>
<header class="top">
 <div class="wrap">
  <a class="brand" href="#/"><img class="c" src="/br/conejo.svg" alt=""><img class="w" src="/br/palabra.svg" alt="beRabbit"></a>
  <span class="ctx" id="ctx"></span>
 </div>
 <nav class="quien" aria-label="Paneles de la muestra"><div class="wrap" id="dnav"></div></nav>
</header>
<div class="vista" id="vista"></div>
<main id="main"></main>
<div id="layer"></div>
<script>
"use strict";
/* ------------------------------------------------------------------
   beRabbit · prototipo navegable.
   Marca independiente de Orbital: comparte infraestructura (Supabase,
   IRIS, Vision Lab, fotos de marcos BR1–BR7) pero no estilos ni textos.
   Los datos son de ejemplo y viven en localStorage ("br-demo-v1").
------------------------------------------------------------------- */
const MOD=[1,2,3,4,5,6,7].map(n=>({i:n-1,n:"Modelo "+n,f:`/p/mb/BR${n}_frente.webp`,l:`/p/mb/BR${n}_lateral.webp`}));
const COL=[
 {k:"cherry",n:"Cherry oscuro",s:"Cherry",hex:"#6b1e2c",t:["#6b1e2c"]},
 {k:"musgo",n:"Verde musgo",s:"Musgo",hex:"#5d6b3b",t:["#5d6b3b"]},
 {k:"hielo",n:"Hielo translúcido",s:"Hielo",hex:"#dfe6ea",t:["#dfe4e8",.4]},
 {k:"petroleo",n:"Azul petróleo",s:"Petróleo",hex:"#1d5a68",t:["#1d5a68"]},
 {k:"gris",n:"Gris amarronado",s:"Gris",hex:"#7b7068",t:["#7b7068"]},
 {k:"marron",n:"Marrón",s:"Marrón",hex:"#5b3a25",t:["#5b3a25"]},
 {k:"negro",n:"Negro",s:"Negro",hex:"#1b1b1c",t:null}];
const AUM=["0","+0,5","+1,0","+1,5","+2,0","+2,5","+3,0"];
const FIS=a=>a>=2; // 0 y +0,5 rotan menos: solo virtuales
const P={arm:29500,par:3500,comb:29700,lista:33000,pub:79000,receta:7000,neto:65289};
const ESTADOS=[["prospecto","Prospecto"],["presentacion","Presentación enviada"],["vista","La vio"],["paquete","Paquete armado"],["activa","Exhibidor activo"]];
const VENDS=["Lola","Bruno","Adrián","Mauro"];
const PAQ_STD=[0,0,1,1,2,2,1];

/* ---------------- fotos de marcos teñidas (misma técnica que marca blanca) ---------------- */
const TC={},TI={};
function loadImg(s){return TI[s]||(TI[s]=new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=s}))}
async function tinted(src,ci,W=640){
  const t=COL[ci].t,k=src+"|"+ci+"|"+W;if(TC[k])return TC[k];
  const im=await loadImg(src),w=Math.min(W,im.naturalWidth),h=Math.round(im.naturalHeight*w/im.naturalWidth),cv=document.createElement("canvas");cv.width=w;cv.height=h;
  const x=cv.getContext("2d");x.drawImage(im,0,0,w,h);
  // Tiñe el acetato y vuelve transparente el fondo blanco y los cristales (alfa = cuánto "marco" tiene el píxel).
  const d=x.getImageData(0,0,w,h),p=d.data;let s=0,n=0;for(let i=0;i<p.length;i+=16){const L=(p[i]*.3+p[i+1]*.59+p[i+2]*.11)/255;if(L<.55){s+=L;n++}}const b=n?s/n:.25;
  const c=t?[1,3,5].map(j=>parseInt(t[0].slice(j,j+2),16)):null,a=t?.[1]??1;
  for(let i=0;i<p.length;i+=4){const L=(p[i]*.3+p[i+1]*.59+p[i+2]*.11)/255,m=Math.min(1,Math.max(0,(.93-L)/.5));p[i+3]=Math.round(255*m*(a<1?.75:1));if(!m||!c)continue;const q=L/b;
    for(let j=0;j<3;j++)p[i+j]=q<=1?c[j]*(.35+.65*q):c[j]+(255-c[j])*Math.min(1,(q-1)*.6)}
  x.putImageData(d,0,0);return TC[k]=cv.toDataURL("image/png");
}
const fimg=(m,c,cls="",W=640,lat=false)=>`<img class="${cls}" data-t="${lat?MOD[m].l:MOD[m].f}" data-c="${c}" data-w="${W}" src="${lat?MOD[m].l:MOD[m].f}" alt="${esc(combo(m,c))}">`;
function tintAll(){document.querySelectorAll("img[data-t]").forEach(im=>{tinted(im.dataset.t,+im.dataset.c,+im.dataset.w).then(u=>{if(im.isConnected&&im.getAttribute("src")!==u)im.src=u}).catch(()=>{})})}

  else{
    const alt=[];
    if(!hayM){for(let cc=0;cc<7;cc++)if(cc!==c&&o.marcos[m][cc]>0)alt.push([m,cc]);for(let mm=0;mm<7;mm++)if(mm!==m&&o.marcos[mm][c]>0&&o.cris[mm][a]>0)alt.push([mm,c])}
    estado=`<div class="note warn stack" style="--x:0">${!hayM?`<div><b>Ese armazón no está.</b> ${o.camM[m][c]?"Viene uno en camino.":"Sumalo a la reposición."}</div>`:""}
     ${!hayC?`<div><b>${FIS(a)?"No queda cristal "+AUM[a]+" para este modelo.":"El "+AUM[a]+" sale de tus pares a favor."}</b> ${o.virt[m]>0?`Tenés ${o.virt[m]} par${o.virt[m]>1?"es":""} a favor del ${MOD[m].n.toLowerCase()}.`:""}</div>
       <div class="row"><button class="btn sm acc" data-a="pedirVirtual">${o.virt[m]>0?"Usar 1 a favor y reservar":"Pedir el cristal y reservar"}</button><span class="tiny">Llega en 24–72 h. Le avisamos al cliente.</span></div>`:""}
     ${alt.length?`<div><b>Se puede armar otra:</b> ${alt.slice(0,4).map(([mm,cc])=>`<button class="btn sm" data-a="alt" data-m="${mm}" data-c="${cc}">${combo(mm,cc)}</button>`).join(" ")}</div>`:""}</div>`;
  }
  const precio=V.receta?P.pub-P.receta:P.pub;
  return `<div class="cfg">
   <div class="stack">
    <div class="stage">${fimg(m,c,"",900)}<div class="tagc"><span class="pill inv">${combo(m,c,a)}</span></div></div>
    ${estado}
    <div class="card pad stack">
      <div class="lbl" style="margin:0">Mostrale al cliente</div>
      <p class="small muted" style="margin:0">Probá el aumento con los probadores del exhibidor. El auxilio es igual en los dos ojos y resuelve el día. El definitivo va con receta, en el mismo marco.</p>
      <div class="row"><a class="btn sm" href="#/tienda" target="_blank" rel="noopener">Catálogo de las 343 combinaciones</a><a class="btn sm" href="${testLink(o)}" target="_blank" rel="noopener">Test visual en la tablet</a></div>
    </div>
   </div>
   <div class="card pad stack">
    ${selector(V,{stockOf:i=>FIS(i)?o.cris[m][i]:"a favor"})}
    <hr class="sep">
    <label class="check"><input type="checkbox" data-a="receta" ${V.receta?"checked":""}><span><b>Doble venta: deja su receta</b><br><span class="small muted">Le descontás ${ars(P.receta)} y el auxilio le sale sin cargo a cuenta del anteojo definitivo, en el mismo marco.</span></span></label>
    ${V.receta?`<div class="grid g2"><div class="fld"><label for="vcli">Cliente</label><input class="in" id="vcli" data-f="cli" value="${esc(V.cli)}" placeholder="Nombre"></div><div class="fld"><label for="vtel">WhatsApp</label><input class="in" id="vtel" data-f="tel" value="${esc(V.tel)}" placeholder="11 …" inputmode="tel"></div></div>`:""}
    <div class="row between"><div><div class="tiny muted">Cobrás</div><div class="big num">${ars(precio)}</div></div>
    <button class="btn acc" data-a="vender" ${ok?"":"disabled"}>Registrar venta</button></div>
    <p class="tiny muted" style="margin:0">Cada venta descuenta un armazón y un par, y arma sola el pedido para reponer.</p>
   </div></div>
   <div class="card" style="margin-top:14px"><div class="pad" style="padding-bottom:6px"><div class="lbl">Vendido esta semana</div></div>
   ${o.ventas.length?o.ventas.slice(0,8).map(v=>`<div class="li">${fimg(v.m,v.c,"thumb",200)}<div class="grow"><div class="t">${combo(v.m,v.c,v.a)}</div><div class="s">${esc(v.d)} · ${esc(v.cli||"Mostrador")}${v.receta?" · dejó receta":""}</div></div>${v.rep?'<span class="pill ok">Repuesto</span>':'<span class="pill">A reponer</span>'}</div>`).join(""):`<div class="empty">Todavía no hay ventas.</div>`}</div>`;
}

/* =================================================================
   STOCK Y REPOSICIÓN
   Un solo lugar para el gabinete: armazones (modelo × color) y cristales (modelo × aumento) en la
   misma fila, porque se venden juntos. Los pares "a favor" son cristales que la óptica ya pagó y
   quedan guardados en beRabbit: no ocupan el gabinete ni vencen, se usan para 0 y +0,5 o cuando un
   aumento se agotó, y llegan cortados para ese modelo en 24–72 h. Por eso se cuentan por modelo.
   El asistente lee el gabinete y las ventas, explica qué pasa y arma el pedido sugerido; en el
   prototipo responde con reglas, en producción con Claude (edge function br-asistente) y los mismos datos.
================================================================= */
const AUMF=[2,3,4,5,6];
const sinTilde=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const enumera=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+" y "+a[a.length-1];
const COLK=[/cherry/,/musgo|verde/,/hielo|translu/,/petrol|azul/,/gris/,/marron/,/negro/];
function rpNuevo(o){RP={id:o.id,arm:m7(0),par:m7(0),fav:Array(7).fill(0),ventas:[],sel:{},hechas:{},chat:[],selC:[],selM:[],selA:[],conCris:false,aumT:4}}
function listas(o,m){const c=o.marcos[m].filter(v=>v>0).length,a=AUMF.filter(i=>o.cris[m][i]>0).length;return {c,a,n:c*a,fav:c*(o.virt[m]>0?7:a)}}
function rotacion(o){const r=Array(7).fill(0);o.ventas.forEach(v=>r[v.a]+=2);topCombos().forEach(t=>r[t.a]+=t.n);return r}
const aumTop=o=>{const r=rotacion(o);return AUMF.reduce((b,a)=>r[a]>r[b]?a:b,AUMF[0])};

/* Pedido sugerido: lo vendido vuelve igual, después los huecos de armazón, los cristales en cero
   (tira de 7 si faltan en 4 modelos o más) y, opcional, un par a favor para los modelos que no tienen. */
function sugerir(o){
  const L=[],cA=m7(0),cP=m7(0),rot=rotacion(o),top=aumTop(o);
  // Repone hasta la base: un armazón por modelo y color, y los pares por aumento del paquete de la óptica.
  o.ventas.forEach((v,i)=>{if(v.rep)return;
    const arm=o.marcos[v.m][v.c]+o.camM[v.m][v.c]+cA[v.m][v.c]<1,par=FIS(v.a)&&o.cris[v.m][v.a]+o.camC[v.m][v.a]+cP[v.m][v.a]<Math.max(1,o.paq.aum[v.a]);
    if(arm)cA[v.m][v.c]++;if(par)cP[v.m][v.a]++;
    L.push({k:"v"+i,g:"Lo que vendiste",t:combo(v.m,v.c,v.a),w:`Vendido el ${v.d}: `+(arm&&par?"vuelve igual al gabinete.":arm?"vuelve el armazón; el par ya lo tenés.":par?"vuelve el par; el armazón ya lo tenés.":"ya está cubierto, no hace falta pedir nada."),arm:arm?[[v.m,v.c]]:[],par:par?[[v.m,v.a]]:[],fav:[],venta:i,def:true})});
  for(let m=0;m<7;m++){const f=COL.map((_,c)=>c).filter(c=>o.marcos[m][c]===0&&!o.camM[m][c]&&!cA[m][c]);
    if(f.length)L.push({k:"h"+m,g:"Huecos del gabinete",t:`${MOD[m].n}: ${enumera(f.map(c=>COL[c].s))}`,w:`Falta${f.length>1?"n":""} para tener los 7 colores de este modelo.`,arm:f.map(c=>[m,c]),par:[],fav:[],def:true})}
  for(const a of AUMF){const ms=MOD.map(md=>md.i).filter(m=>o.cris[m][a]===0&&!o.camC[m][a]&&!cP[m][a]);if(!ms.length)continue;
    const caliente=rot[a]>=rot[top]*.6;
    if(ms.length>=4)L.push({k:"t"+a,g:"Cristales en cero",t:`Tira de ${AUM[a]} · un par para cada modelo`,w:`Quedó en cero en ${ms.length} modelos${a===top?" y es tu aumento más vendido":""}. La tira cuesta ${ars(7*P.par)}.`,arm:[],par:MOD.map(md=>[md.i,a]),fav:[],def:true});
    else L.push({k:"c"+a,g:"Cristales en cero",t:`Pares ${AUM[a]} para el modelo ${enumera(ms.map(m=>String(m+1)))}`,w:caliente?`${AUM[a]} es de los que más salen: conviene tenerlo en el gabinete.`:`Rota poco: podés esperar o cubrirlo con un par a favor.`,arm:[],par:ms.map(m=>[m,a]),fav:[],def:caliente})}
  const sinFav=MOD.map(md=>md.i).filter(m=>!o.virt[m]);
  if(sinFav.length)L.push({k:"f",g:"A favor en beRabbit",t:`1 par a favor para el modelo ${enumera(sinFav.map(m=>String(m+1)))}`,w:"No ocupa lugar en el gabinete: cubre un 0, un +0,5 o un aumento agotado de ese modelo.",arm:[],par:[],fav:sinFav,def:false});
  return L;
}
const sugOn=x=>RP.sel[x.k]??x.def;
const unid=x=>[x.arm.length?`${x.arm.length} arm.`:"",x.par.length?`${x.par.length} par${x.par.length>1?"es":""}`:"",x.fav.length?`${x.fav.length} a favor`:""].filter(Boolean).join(" · ");

function diagnostico(o){
  const pend=o.ventas.filter(v=>!v.rep).length;let hoy=0,fav=0,peor=0;
  for(let m=0;m<7;m++){const l=listas(o,m);hoy+=l.n;fav+=l.fav;if(l.n<listas(o,peor).n)peor=m}
  const top=aumTop(o),lp=listas(o,peor),sinTop=MOD.filter(md=>!o.cris[md.i][top]).length;
  return [
   `Hoy armás <b>${hoy} de 245</b> combinaciones con lo que hay en el gabinete${fav>hoy?`; con tus pares a favor llegás a <b>${fav}</b> (en 24–72 h)`:""}.`,
   pend?`Vendiste <b>${pend}</b> sin reponer: cada venta vuelve igual (armazón y par), salvo que la destildes.`:`No tenés ventas pendientes de reponer.`,
   `El más flojo es el <b>${MOD[peor].n.toLowerCase()}</b>: ${lp.c} de 7 colores y ${lp.a} de 5 aumentos.`,
   `Tu aumento más vendido es <b>${AUM[top]}</b>${sinTop?` y está en cero en ${sinTop} modelo${sinTop>1?"s":""}`:""}.`];
}

/* Asistente: entiende "modelo 3 cherry +1,5", "qué me falta", "a favor", "qué sale más", precios. */
function iaResp(o,q){
  let t=sinTilde(q),m=null,a=null;
  const mm=t.match(/\b(?:modelo|mod|m)\s*([1-7])\b/);if(mm){m=+mm[1]-1;t=t.replace(mm[0]," ")}
  const ci=COLK.findIndex(r=>r.test(t));
  const am=t.match(/(?:^|[^\d])(\+?\s?[0-3](?:[.,][05])?)(?!\d)/);
  if(am){const v=parseFloat(am[1].replace(/[+\s]/g,"").replace(",","."));if(v*2===Math.round(v*2)&&v>=0&&v<=3)a=v*2}
  const btns=b=>b.length?`<div class="row" style="margin-top:8px">${b.join("")}</div>`:"";
  if(/favor|virtual/.test(t))return `Los pares <b>a favor</b> son cristales que ya pagaste y quedan guardados en beRabbit, no en tu gabinete. No vencen y no ocupan lugar.<br>Se usan cuando un cliente pide un aumento que no tenés: siempre el 0 y el +0,5 (rotan poco y no van en el gabinete) o uno que se agotó. Tocás <b>Usar</b>, elegís el aumento y te llega cortado para ese modelo en 24–72 h, sin cargo.<br>Se cuentan por modelo porque cada cristal se corta para la forma de ese marco. Hoy tenés: ${MOD.map(md=>`${md.i+1}: <b>${o.virt[md.i]}</b>`).join(" · ")}. Para sumar, tocá + en la columna A favor o tildalo en el pedido sugerido.`;
  if(m!=null&&ci>=0&&a!=null){
    const hayM=o.marcos[m][ci]>0,hayC=FIS(a)&&o.cris[m][a]>0,b=[];
    let r=`<b>${combo(m,ci,a)}</b><br>`+(hayM?`Armazón: lo tenés.`:`Armazón: no está${o.camM[m][ci]?", viene uno en camino":""}.`)+" "+
      (hayC?`Cristal ${AUM[a]}: tenés ${o.cris[m][a]} par${o.cris[m][a]>1?"es":""}.`:!FIS(a)?`El ${AUM[a]} no va en el gabinete: sale de tus pares a favor del modelo ${m+1} (te quedan ${o.virt[m]}).`:`Cristal ${AUM[a]}: en cero para este modelo${o.camC[m][a]?", viene en camino":""}.`);
    if(hayM&&hayC){r+=" <b>Se arma ya.</b>";b.push(`<button class="btn sm acc" data-a="iaVender" data-m="${m}" data-c="${ci}" data-x="${a}">Ir a vender</button>`)}
    else{
      if(!hayC&&o.virt[m])b.push(`<button class="btn sm acc" data-a="iaFav" data-m="${m}" data-x="${a}">Usar 1 a favor · llega en 24–72 h</button>`);
      if(!hayC&&FIS(a))b.push(`<button class="btn sm" data-a="iaAdd" data-t="par" data-m="${m}" data-i="${a}">Sumar el par al pedido</button>`);
      if(!hayM)b.push(`<button class="btn sm" data-a="iaAdd" data-t="arm" data-m="${m}" data-i="${ci}">Sumar el armazón al pedido</button>`);
      const altC=hayC?COL.map((_,cc)=>cc).filter(cc=>cc!==ci&&o.marcos[m][cc]>0).map(cc=>COL[cc].s):[];
      const altM=FIS(a)?MOD.filter(md=>md.i!==m&&o.marcos[md.i][ci]>0&&o.cris[md.i][a]>0).map(md=>String(md.i+1)):[];
      if(altC.length||altM.length)r+=`<br><b>Para que se lo lleve hoy:</b> ${[altC.length?`el mismo modelo y aumento en ${enumera(altC.slice(0,4))}`:"",altM.length?`el ${COL[ci].s.toLowerCase()} ${AUM[a]} en el modelo ${enumera(altM)}`:""].filter(Boolean).join(", o ")}.`}
    return r+btns(b);
  }
  if(m!=null){const l=listas(o,m),f=COL.filter((_,c)=>!o.marcos[m][c]).map(c=>c.s),z=AUMF.filter(x=>!o.cris[m][x]).map(x=>AUM[x]);
    return `<b>${MOD[m].n}</b>: ${7-f.length} de 7 colores${f.length?` (falta ${enumera(f)})`:""}, cristales en ${5-z.length} de 5 aumentos${z.length?` (en cero: ${enumera(z)})`:""} y ${o.virt[m]} par${o.virt[m]===1?"":"es"} a favor. Hoy armás <b>${l.n} de 35</b> combinaciones de este modelo.`}
  if(ci>=0&&a!=null){const ms=FIS(a)?MOD.filter(md=>o.marcos[md.i][ci]>0&&o.cris[md.i][a]>0).map(md=>String(md.i+1)):[];
    return ms.length?`${COL[ci].n} con ${AUM[a]}: lo armás ya en el modelo ${enumera(ms)}.`:`${COL[ci].n} con ${AUM[a]} no se arma hoy con el gabinete. ${FIS(a)?"Sumá el par al pedido o usá uno a favor.":`El ${AUM[a]} sale de tus pares a favor.`}`}
  if(ci>=0){const si=MOD.filter(md=>o.marcos[md.i][ci]>0).map(md=>String(md.i+1)),no=MOD.filter(md=>!o.marcos[md.i][ci]).map(md=>String(md.i+1));
    return `${COL[ci].n}: lo tenés en el modelo ${enumera(si)||"ninguno"}${no.length?`; falta en el ${enumera(no)}`:""}.`}
  if(a!=null){if(!FIS(a))return `El ${AUM[a]} no va en el gabinete: lo pedís de tus pares a favor cuando un cliente lo necesita.`;
    const si=MOD.filter(md=>o.cris[md.i][a]>0).map(md=>String(md.i+1)),no=MOD.filter(md=>!o.cris[md.i][a]).map(md=>String(md.i+1));
    return `Cristal ${AUM[a]}: tenés en el modelo ${enumera(si)||"ninguno"}${no.length?`; en cero en el ${enumera(no)}`:""}.`}
  if(/falt|pido|pedir|repon|suger|compr|hago/.test(t)){const L=sugerir(o).filter(x=>!RP.hechas[x.k]&&sugOn(x));
    return L.length?`Te sugiero ${L.length} cosa${L.length>1?"s":""}: ${L.slice(0,5).map(x=>x.t).join("; ")}${L.length>5?"; …":""}.<br>Están tildadas arriba: destildá lo que no quieras y tocá <b>Pasar al pedido</b>.`+btns([`<button class="btn sm acc" data-a="iaAplicar">Pasar al pedido</button>`]):`Lo sugerido ya está en tu pedido. Revisalo a la derecha y confirmalo.`}
  if(/precio|cuanto|cuesta|cobr|sale\s*\$/.test(t))return `Armazón ${ars(P.arm)} · par de cristales ${ars(P.par)} · combinado (armazón + par del mismo modelo) ${ars(P.comb)}, con 10% sobre lista. Todo sin IVA y sin mínimo. Los pares a favor se pagan como un par común.`;
  if(/vend|sale|rota|lleva|elig/.test(t)){const r=rotacion(o),ord=[...AUMF].sort((x,y)=>r[y]-r[x]),cc=Array(7).fill(0);o.ventas.forEach(v=>cc[v.c]++);topCombos().forEach(x=>cc[x.c]+=x.n);const oc=COL.map((_,i)=>i).sort((x,y)=>cc[y]-cc[x]);
    return `Lo que más sale: aumentos <b>${AUM[ord[0]]}</b> y <b>${AUM[ord[1]]}</b>; colores <b>${COL[oc[0]].s}</b> y <b>${COL[oc[1]].s}</b>. Conviene que esos nunca queden en cero; el ${AUM[ord[4]]} rota menos y lo podés cubrir con pares a favor.`}
  if(/combinac|lista/.test(t))return `"Listas" son las combinaciones que armás hoy en el mostrador: colores que tenés × aumentos con cristal en el gabinete. Un modelo completo da 35 (7 × 5); los 7 modelos, 245. Con 0 y +0,5 desde los pares a favor llegás a las 343.`;
  return `Puedo ayudarte con:<br>· una combinación: <i>"modelo 3 cherry +1,5"</i><br>· un modelo: <i>"modelo 7"</i><br>· <i>"¿qué me falta?"</i> o <i>"¿qué pido?"</i><br>· <i>"¿qué son los pares a favor?"</i><br>· <i>"¿qué es lo que más sale?"</i> o precios.`;
}

function tStock(o){
  if(RP.id!==o.id)rpNuevo(o);
  const L=sugerir(o),act=L.filter(x=>!RP.hechas[x.k]),on=act.filter(sugOn);
  const uA=on.reduce((s,x)=>s+x.arm.length,0),uP=on.reduce((s,x)=>s+x.par.length+x.fav.length,0);
  const grupos=[...new Set(act.map(x=>x.g))];
  const toggles=(k,items)=>`<div class="chips">${items.map(([v,n,hex])=>`<button class="chip" data-a="rpSel" data-k="${k}" data-v="${v}" aria-pressed="${RP[k].includes(v)}">${hex?`<span class="dot" style="background:${hex};vertical-align:-1px"></span> `:""}${n}</button>`).join("")}</div>`;
  const nTiraA=7*(RP.selC.length+RP.selM.length),nTiraP=(RP.conCris?nTiraA:0)+7*RP.selA.length;
  return `<div class="stk">
  <div class="stack">
   <div class="card pad stack ia">
    <div class="row" style="gap:10px;flex-wrap:nowrap"><span class="ia-av">IA</span><div><div style="font-weight:700">Asistente de reposición</div><div class="tiny muted">Lee tu gabinete y tus ventas, te explica qué pasa y arma el pedido. Vos decidís qué va.</div></div></div>
    <ul class="ia-d">${diagnostico(o).map(t=>`<li><span>${t}</span></li>`).join("")}</ul>
    ${act.length?`<div style="display:grid;gap:12px">${grupos.map(g=>`<div><div class="lbl">${g}</div><div style="display:grid;gap:6px">${act.filter(x=>x.g===g).map(x=>`<label class="sug"><input type="checkbox" data-sug="${x.k}" ${sugOn(x)?"checked":""}><span class="grow"><b>${x.t}</b><br><span class="small muted">${x.w}</span></span><span class="tiny muted num" style="white-space:nowrap">${unid(x)}</span></label>`).join("")}</div></div>`).join("")}
      <div class="row between"><span class="small">${uA+uP?`Sumás <b>${uA} armazones</b> y <b>${uP} pares</b>`:"Tildá lo que quieras pedir."}</span><button class="btn acc sm" data-a="iaAplicar" ${uA+uP?"":"disabled"}>Pasar al pedido</button></div></div>`
     :`<div class="note ok">Lo sugerido ya está en tu pedido. Revisalo y confirmalo.</div>`}
    <hr class="sep" style="margin:4px 0">
    <div class="chat" id="chat">${RP.chat.map(c=>`<div class="msg ${c.yo?"yo":"ia"}">${c.h}</div>`).join("")||`<div class="msg ia">Preguntame por una combinación que te pidan (<i>"modelo 3 cherry +1,5"</i>), qué te falta o qué son los pares a favor.</div>`}</div>
    <div class="row" style="flex-wrap:nowrap"><input class="in" id="iaq" placeholder="Ej.: un cliente quiere el modelo 7 negro +2,0" autocomplete="off" aria-label="Preguntale al asistente"><button class="btn pri" data-a="iaEnviar">Preguntar</button></div>
    <div class="chips">${["¿Qué me falta?","Modelo 7 negro +2,0","¿Qué son los pares a favor?","¿Qué es lo que más sale?"].map(q=>`<button class="chip" data-a="iaPreg" data-q="${esc(q)}" style="font-weight:500;font-size:13px">${esc(q)}</button>`).join("")}</div>
   </div>

   <div class="card"><div class="pad" style="padding-bottom:8px"><div class="row between"><div class="lbl" style="margin:0">Tu gabinete · armazones y cristales por modelo</div>
     <div class="leg"><span><span class="dot" style="background:var(--ink3)"></span> hay</span><span><span class="dot" style="background:transparent;box-shadow:none;border:2px dashed var(--warn)"></span> falta</span><span><span class="dot" style="background:var(--ok)"></span> en camino</span><span><span class="dot" style="background:var(--rust)"></span> en tu pedido</span></div></div>
     <p class="tiny muted" style="margin:6px 0 0">Tocá un color o un aumento para sumar uno al pedido. Los cristales vienen cortados para cada modelo: por eso se cuentan por modelo.</p></div>
    <div class="gr h"><span>Modelo</span><span>Armazones · 7 colores</span><span>Cristales · pares por aumento</span><span>A favor</span><span>Listas</span></div>

/* El 10% del combinado se aplica a cada armazón que va con un par (o par a favor) de su mismo modelo. */
function rpCalc(){let comb=0,arm=0,par=0;for(let m=0;m<7;m++){const a=RP.arm[m].reduce((x,y)=>x+y,0),p=RP.par[m].reduce((x,y)=>x+y,0)+RP.fav[m],k=Math.min(a,p);comb+=k;arm+=a-k;par+=p-k}
  return {comb,arm,par,uA:sum(RP.arm),uP:sum(RP.par),uF:RP.fav.reduce((x,y)=>x+y,0),tot:comb*P.comb+arm*P.arm+par*P.par}}
function rpResumen(){const r=rpCalc(),fila=(t,q,v)=>q?`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="small">${t} × ${q}</span><span class="num" style="font-weight:600">${ars(v)}</span></div>`:"";
  const qi=(lbl,n,t,m,i)=>`<span class="qi">${lbl}${n>1?` ×${n}`:""}<button data-a="rpQuitar" data-t="${t}" data-m="${m}" data-i="${i}" aria-label="Quitar uno">×</button></span>`;
  const items=MOD.map(md=>{const m=md.i,q=[];COL.forEach((c,ci)=>{if(RP.arm[m][ci])q.push(qi(`<span class="dot" style="background:${c.hex}"></span>${c.s}`,RP.arm[m][ci],"arm",m,ci))});
    AUMF.forEach(a=>{if(RP.par[m][a])q.push(qi(`Par ${AUM[a]}`,RP.par[m][a],"par",m,a))});if(RP.fav[m])q.push(qi("A favor",RP.fav[m],"fav",m,0));
    return q.length?`<div><div class="small" style="font-weight:600;margin-bottom:4px">${md.n}</div><div class="chips">${q.join("")}</div></div>`:""}).join("");
  return `<div class="row between"><div class="lbl" style="margin:0">Tu pedido</div><span class="pill">Sin IVA</span></div>
  ${items?`<div style="display:grid;gap:10px">${items}</div>`:`<div class="empty" style="padding:18px">Vacío. Pasá el sugerido del asistente o tocá un color o un aumento del gabinete.</div>`}
  ${r.uA+r.uP+r.uF?`<div class="small muted">${r.uA} armazones · ${r.uP} pares al gabinete${r.uF?` · ${r.uF} a favor`:""}</div>`:""}
  <div>${fila("Combinado (armazón + par del mismo modelo) · "+ars(P.comb),r.comb,r.comb*P.comb)}${fila("Armazón solo · "+ars(P.arm),r.arm,r.arm*P.arm)}${fila("Par de cristales solo · "+ars(P.par),r.par,r.par*P.par)}</div>
  <div class="row between"><span class="small muted">Total</span><span class="big num">${ars(r.tot)}</span></div>
  ${r.comb?`<div class="tiny" style="color:var(--ok);font-weight:600">Ahorrás ${ars(r.comb*(P.lista-P.comb))} con el 10% del combinado.</div>`:""}
  <button class="btn acc" data-a="confirmarRepo" ${r.uA+r.uP+r.uF?"":"disabled"}>Confirmar pedido</button>
  <button class="btn ghost sm" data-a="rpVaciar" ${r.uA+r.uP+r.uF?"":"disabled"}>Vaciar</button>
  <p class="tiny muted" style="margin:0">Sin mínimo de compra. Lo que va al gabinete aparece en camino (punto verde); los pares a favor se acreditan al confirmar.</p>`}

document.addEventListener("click",ev=>{const el=ev.target.closest("[data-a]");if(!el||el.tagName==="SELECT"||el.tagName==="INPUT"&&el.type!=="checkbox")return;const f=ACT[el.dataset.a];if(!f)return;
