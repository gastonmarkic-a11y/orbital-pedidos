<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Carga IG</title></head>
<body>
<p id="e">Puente de carga de influencers de Instagram.</p>
<script>
// Puente de una sola función: la pestaña de instagram.com no puede hablar con Supabase
// (su CSP lo bloquea), así que carga esta página en un iframe y le manda las filas por
// postMessage. Acá se llama a la RPC ig_infl_cargar, que valida la clave de Orbital.
const SB = 'https://towcgvphxeqilpdnboki.supabase.co'
const K = 'sb_publishable_YhNbcs63Zx6na8pfEsQgCw_C3iKSk-A'
const ORIGENES = ['https://www.instagram.com', 'https://instagram.com']
let cargadas = 0

window.addEventListener('message', async (ev) => {
  if (!ORIGENES.includes(ev.origin)) return
  const { clave, datos } = ev.data || {}
  if (!clave || !Array.isArray(datos)) return
  for (let i = 0; i < datos.length; i += 50) {
    const parte = datos.slice(i, i + 50)
    const r = await fetch(SB + '/rest/v1/rpc/ig_infl_cargar', {
      method: 'POST',
      headers: { apikey: K, Authorization: 'Bearer ' + K, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_clave: clave, p_datos: parte }),
    })
    if (!r.ok) { ev.source.postMessage({ igCarga: 'error', estado: r.status, cargadas }, ev.origin); return }
    cargadas += parte.length
  }
  document.getElementById('e').textContent = 'Cargadas ' + cargadas
  ev.source.postMessage({ igCarga: 'ok', cargadas }, ev.origin)
})
</script>
</body>
</html>
